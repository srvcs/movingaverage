schemaVersion: 1
name: "srvcs-movingaverage"
slug: "movingaverage"
repository: "srvcs/movingaverage"
package: "srvcs-movingaverage"
function: "statistics: moving (sliding-window) average"
kind: "orchestrator"
categories:
  - "statistics"
dependencies:
  - slug: "sum"
    service: "srvcs-sum"
  - slug: "floatdivide"
    service: "srvcs-floatdivide"
endpoints:
  - method: "GET"
    path: "/"
    purpose: "Service identity"
  - method: "POST"
    path: "/"
    purpose: "Evaluate the service function"
  - method: "GET"
    path: "/healthz"
    purpose: "Liveness probe"
  - method: "GET"
    path: "/readyz"
    purpose: "Readiness probe"
  - method: "GET"
    path: "/metrics"
    purpose: "Prometheus metrics"
  - method: "GET"
    path: "/openapi.json"
    purpose: "OpenAPI document"
inputs:
  - name: "values"
    type: "json[]"
    required: true
  - name: "window"
    type: "integer"
    required: true
outputs:
  - name: "values"
    type: "json[]"
  - name: "window"
    type: "integer"
  - name: "result"
    type: "number[]"
configuration:
  - name: "SRVCS_BIND_ADDR"
    default: "0.0.0.0:8080"
    purpose: "Bind address"
  - name: "SRVCS_ENV"
    default: "development"
    purpose: "Environment label for logs"
  - name: "RUST_LOG"
    default: "info,tower_http=info"
    purpose: "Tracing filter"
  - name: "SRVCS_FLOATDIVIDE_URL"
    default: "http://127.0.0.1:8089"
    purpose: "Base URL for srvcs-floatdivide"
  - name: "SRVCS_SUM_URL"
    default: "http://127.0.0.1:8088"
    purpose: "Base URL for srvcs-sum"
